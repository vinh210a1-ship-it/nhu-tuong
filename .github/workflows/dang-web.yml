# Tự kiểm và đăng web lên GitHub Pages.
# - Mỗi yêu cầu đăng (PR): kiểm máy tính + build thử, không đăng.
# - Mỗi lần nhánh main thay đổi: build và đăng lên https://vinh210a1-ship-it.github.io/nhu-tuong/
name: Đăng web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kiểm máy tính với bảng ví dụ trong bài
        run: npm run kiem
      - name: Build web
        run: npm run build
      - name: Kiểm sau build (chuỗi cấm, liên kết nội bộ)
        run: npm run kiem-sau-build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
