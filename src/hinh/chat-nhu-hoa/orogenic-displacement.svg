<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 486" width="360" height="486" role="img" aria-labelledby="oro-t oro-d">
<title id="oro-t">Orogenic displacement: chất hoạt động bề mặt đẩy protein khỏi mặt phân cách</title>
<desc id="oro-d">Ba ô xếp dọc, nhìn từ trên xuống mặt phân cách, theo nồng độ chất hoạt động bề mặt tăng dần. Ô 1: mạng protein nguyên vẹn nhưng có vài chỗ khuyết. Ô 2: chất hoạt động bề mặt xen vào chỗ khuyết thành các miền tròn, miền lớn lên và nén mạng protein quanh nó. Ô 3: các miền chiếm gần hết bề mặt, mạng protein vỡ và các mảnh protein rời bề mặt vào pha khối.</desc>
