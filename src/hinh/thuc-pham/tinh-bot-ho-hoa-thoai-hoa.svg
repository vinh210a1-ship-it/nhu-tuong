<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 512" width="360" height="512" role="img" aria-labelledby="tinhbot-t tinhbot-d">
<title id="tinhbot-t">Tinh bột: từ hạt bán tinh thể tới hồ hóa và thoái hóa</title>
<desc id="tinhbot-d">Bốn ô xếp dọc. Ô a: hạt tinh bột bán tinh thể. Ô b: thêm nước và nhiệt, hạt hấp thụ nước và trương lên. Ô c: gia nhiệt tiếp, hồ hóa, xoắn kép nóng chảy và amylose rò ra khỏi hạt. Ô d: sau khi làm nguội, các chuỗi xếp lại song song và tái kết tinh, gọi là thoái hóa.</desc>
