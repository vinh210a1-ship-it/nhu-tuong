<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460" width="360" height="460" role="img" aria-labelledby="dahinh-t dahinh-d">
<title id="dahinh-t">Ba dạng đa hình α, β′ và β của chất béo</title>
<desc id="dahinh-d">Ba ô xếp dọc, nhìn dọc theo trục chuỗi hydrocarbon. Dạng α: các chuỗi xếp lưới lục giác và quay tự do. Dạng β′: lưới trực thoi, mặt phẳng zigzag của các chuỗi kề nhau vuông góc với nhau. Dạng β: lưới tam tà, mọi mặt phẳng zigzag song song. Mũi tên một chiều đi từ α sang β′ rồi sang β: dạng kém bền tự chuyển dần sang dạng bền hơn.</desc>
