<text x="122" y="100">glycerol</text>
<text x="90" y="213" text-anchor="middle">sn-1 và sn-3 cùng phía,</text>
<text x="90" y="230" text-anchor="middle">sn-2 hướng ngược lại</text>
<text x="272" y="213" text-anchor="middle">thường gặp ở TAG không</text>
<text x="272" y="230" text-anchor="middle">đối xứng hoặc β′</text>
<text x="90" y="404" text-anchor="middle">ba acid béo giống</text>
<text x="90" y="421" text-anchor="middle">hoặc gần nhau:</text>
<text x="90" y="438" text-anchor="middle">lớp dày khoảng</text>
<text x="90" y="455" text-anchor="middle">2 chiều dài chuỗi</text>
<text x="270" y="404" text-anchor="middle">acid béo khác nhau</text>
<text x="270" y="421" text-anchor="middle">nhiều: chuỗi bị</text>
<text x="270" y="438" text-anchor="middle">phân loại, lớp dày</text>
<text x="270" y="455" text-anchor="middle">3 chiều dài chuỗi</text>
<text x="34" y="485">chuỗi acid béo</text>
<text x="214" y="485">glycerol</text>
<text x="34" y="505">chuỗi acid béo khác loại, xếp riêng một lớp</text>
</g>
