<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 514" width="360" height="514" role="img" aria-labelledby="tag-t tag-d">
<title id="tag-t">Hai cấu hình gấp của TAG và hai kiểu xếp lớp</title>
<desc id="tag-d">Phần a: một phân tử TAG gấp kiểu tuning fork (chuỗi sn-1 và sn-3 cùng phía, sn-2 hướng ngược lại) và kiểu chair (một chuỗi ở đầu glycerol hướng một phía, hai chuỗi kề nhau hướng phía kia). Phần b: các phân tử xếp thành lớp dày khoảng hai chiều dài chuỗi (2L) khi ba acid béo giống nhau, hoặc ba chiều dài chuỗi (3L) khi chuỗi khác loại bị phân loại vào một lớp riêng ở giữa.</desc>
