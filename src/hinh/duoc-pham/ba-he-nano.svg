<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 484" width="360" height="484" role="img" aria-labelledby="nano-t nano-d">
<title id="nano-t">Ba hệ phân tán nano: nanoemulsion, liposome và LNP</title>
<desc id="nano-d">Ba ô xếp dọc, mỗi ô một hạt cắt ngang trong nước. Nanoemulsion: giọt dầu lỏng có một lớp chất hoạt động bề mặt bao quanh. Liposome: túi kín có vỏ là lớp kép lipid, bên trong là pha nước. LNP: hạt lipid có acid nucleic nằm trong lõi lipid và PEG-lipid nhô ra ở bề mặt. Kích thước ba hạt vẽ bằng nhau, không theo tỉ lệ thật.</desc>
