<svg class="hinh" data-chu-giai="dau nuoc tinh-the polymer" viewBox="0 0 360 546" width="360" role="img" aria-labelledby="t d">
<title id="t">Tám cơ chế mất ổn định của giọt nhũ tương và công cụ chính chặn từng cơ chế</title>
<desc id="d">Một giọt ở đầu sơ đồ, nối bằng một trục dọc tới tám ô xếp chồng. Mỗi ô ghi một cơ chế cần chặn và công cụ chính, kèm một hình nhỏ minh họa cơ chế đó. Hai ô keo tụ có hình nhỏ: hai giọt có lớp điện tích bao quanh đẩy nhau, và hai giọt có chuỗi polymer bị nén ở giữa.</desc>
<circle class="h-giot-dau" cx="20" cy="34" r="14"/>
<text class="h-chu" x="44" y="40" font-weight="600">Cơ chế phải chặn và công cụ chính</text>
<path class="h-mui-ten" d="M20 48V509"/>
<path class="h-mui-ten" d="M20 103H34"/>
