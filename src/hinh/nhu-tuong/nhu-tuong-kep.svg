<title id="hinh-nhu-tuong-kep-t">Cấu trúc một giọt nhũ tương kép W/O/W</title>
<desc id="hinh-nhu-tuong-kep-d">Một giọt dầu lớn (O) nằm trong pha nước bên ngoài (W₂). Bên trong giọt dầu có nhiều giọt nước nhỏ (W₁). Mặt trong, giữa W₁ và dầu, do chất nhũ hóa ưa dầu giữ, ví dụ PGPR. Mặt ngoài, giữa dầu và W₂, do chất nhũ hóa ưa nước giữ, ví dụ protein hoặc Tween.</desc>
