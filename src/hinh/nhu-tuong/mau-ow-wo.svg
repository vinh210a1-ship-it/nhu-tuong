<svg data-chu-giai="dau nuoc chat-nhu-hoa" class="hinh" viewBox="0 0 360 566" width="360" role="img" aria-labelledby="t d">
<title id="t">Hai loại nhũ tương đơn giản và bề mặt một giọt dầu có chất nhũ hóa</title>
<desc id="d">Hai khung đầu xếp dọc. Khung trên: nền là nước, các giọt tròn là dầu (O/W). Khung giữa: nền là dầu, các giọt tròn là nước (W/O). Khung cuối phóng to bề mặt một giọt dầu: nước ở trên, dầu ở dưới, các phân tử chất nhũ hóa đứng dọc theo mặt phân cách, đầu ưa nước quay lên về phía nước, đuôi ưa dầu cắm xuống phía dầu.</desc>
<text class="h-chu" x="10" y="18" font-weight="600">Dầu trong nước (oil-in-water, O/W)</text>
