<svg class="hinh" viewBox="0 0 360 318" width="360" role="img" aria-labelledby="t d">
<title id="t">Turbiscan quét dọc ống mẫu và thấy kem hóa là thay đổi tán xạ ngược ở đỉnh và đáy</title>
<desc id="d">Bên trái là ống mẫu đứng với lớp kem ở đỉnh, phần giữa đục và phần đáy trong hơn; một đầu đọc phát ánh sáng cận hồng ngoại quét dọc ống. Bên phải là đồ thị tán xạ ngược theo vị trí dọc ống: đường nét đứt lúc đầu thẳng đứng; sau một thời gian đường liền nhô ra ở đỉnh (tăng) và lùi vào ở đáy (giảm).</desc>
<text class="h-chu" x="10" y="18" font-weight="600">Turbiscan: quét dọc ống mẫu</text>
<rect class="h-khung" x="46" y="36" width="56" height="200" rx="10"/>
