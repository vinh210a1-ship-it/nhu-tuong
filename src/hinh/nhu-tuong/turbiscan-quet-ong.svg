<text class="h-chu" x="10" y="262">Đèn cận hồng ngoại</text>
<text class="h-chu-mo" x="10" y="282">(880 nm) quét dọc ống</text>
<path style="fill:none;stroke:var(--sl-color-gray-3);stroke-width:1.2" d="M166 36L166 236"/>
