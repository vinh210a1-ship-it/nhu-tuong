<svg class="hinh" viewBox="0 0 360 552" width="360" role="img" aria-labelledby="t d">
<title id="t">Hai cách đo cỡ hạt bằng ánh sáng: nhiễu xạ laser và tán xạ ánh sáng động</title>
<desc id="d">Nửa trên, nhiễu xạ laser: chùm laser gặp một hạt rồi tán xạ về phía đầu dò vòng; hạt nhỏ tán xạ ở góc lớn, hạt to tán xạ ở góc nhỏ. Nửa dưới, tán xạ ánh sáng động: hạt chuyển động Brown; hạt nhỏ đi nhiều và nhanh nên đường cong tự tương quan tắt nhanh, hạt to đi ít và chậm nên tắt chậm.</desc>
<text class="h-chu" x="10" y="18" font-weight="600">Nhiễu xạ laser (laser diffraction)</text>
<text class="h-chu-mo" x="10" y="42">Hạt nhỏ: tán xạ ở góc lớn</text>
