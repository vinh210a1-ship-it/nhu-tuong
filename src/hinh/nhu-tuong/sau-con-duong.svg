<circle cx="194" cy="270" r="7.5"/>
<circle cx="170" cy="273" r="7.5"/>
<circle cx="155" cy="254" r="7.5"/>
<circle cx="166" cy="230" r="7.5"/>
<circle cx="190" cy="227" r="7.5"/>
