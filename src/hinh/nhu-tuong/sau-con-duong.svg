<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 636" width="360" height="636" role="img" aria-labelledby="hinh-sau-con-duong-t hinh-sau-con-duong-d">
<title id="hinh-sau-con-duong-t">Sáu con đường vật lý làm nhũ tương mất ổn định</title>
<desc id="hinh-sau-con-duong-d">Ở giữa là nhũ tương ban đầu: giọt dầu rải đều trong nước. Sáu mũi tên tỏa ra sáu ô. Ô 1, kem hóa hoặc lắng: giọt dồn lên trên (hoặc chìm xuống), cỡ giọt không đổi. Ô 2, keo tụ: giọt dính thành cụm nhưng màng từng giọt còn nguyên. Ô 3, hợp giọt: màng vỡ, hai giọt thành một giọt lớn hơn. Ô 4, hợp giọt một phần: tinh thể mỡ đâm qua màng, các giọt dính thành cụm mà vẫn giữ hình. Ô 5, Ostwald ripening: giọt nhỏ tan dần, dầu đi qua nước sang giọt lớn. Ô 6, đảo pha: O/W thành W/O hoặc ngược lại. Mũi tên hai đầu ở ô 1 và ô 2 nghĩa là có thể thuận nghịch; mũi tên một đầu ở ô 3 đến ô 6 nghĩa là không thuận nghịch.</desc>
<!-- nền các ô: nước (xanh) hoặc dầu (hổ phách) -->
<g style="fill:var(--hh-be-mat)">
<rect x="4" y="78" width="170" height="96" rx="10"/>
<rect x="186" y="78" width="170" height="96" rx="10"/>
<rect x="4" y="202" width="100" height="96" rx="10"/>
<rect x="256" y="202" width="100" height="96" rx="10"/>
<rect x="4" y="392" width="170" height="96" rx="10"/>
<rect x="186" y="392" width="170" height="96" rx="10"/>
<circle cx="180" cy="250" r="40"/>
</g>
<g style="fill:var(--hh-nuoc);fill-opacity:.28">
<rect x="4" y="78" width="170" height="96" rx="10"/>
<rect x="186" y="78" width="170" height="96" rx="10"/>
<rect x="256" y="202" width="100" height="96" rx="10"/>
<rect x="186" y="392" width="170" height="96" rx="10"/>
<rect x="4" y="392" width="170" height="96" rx="10"/>
<circle cx="180" cy="250" r="40"/>
</g>
<g style="fill:var(--hh-dau);fill-opacity:.45">
<rect x="4" y="202" width="100" height="96" rx="10"/>
</g>
<g style="fill:none;stroke:var(--hh-nuoc);stroke-width:1.2">
<rect x="4" y="78" width="170" height="96" rx="10"/>
<rect x="186" y="78" width="170" height="96" rx="10"/>
<rect x="256" y="202" width="100" height="96" rx="10"/>
<rect x="186" y="392" width="170" height="96" rx="10"/>
<rect x="4" y="392" width="170" height="96" rx="10"/>
<circle cx="180" cy="250" r="40"/>
</g>
<g style="fill:none;stroke:var(--hh-vien-giot);stroke-width:1.2">
<rect x="4" y="202" width="100" height="96" rx="10"/>
</g>
<!-- bóng nét đứt: vị trí và cỡ giọt TRƯỚC khi đổi (ô 3 và ô 5) -->
<g style="fill:none;stroke:var(--sl-color-gray-2);stroke-width:1.2;stroke-dasharray:3 2.5">
<circle cx="308" cy="270" r="7.5"/>
<circle cx="324" cy="270" r="7.5"/>
<circle cx="28" cy="412" r="7.5"/>
<circle cx="22" cy="440" r="7.5"/>
<circle cx="28" cy="468" r="7.5"/>
<circle cx="128" cy="440" r="12"/>
</g>
<!-- giọt dầu -->
<g style="fill:var(--hh-dau);stroke:var(--hh-vien-giot);stroke-width:1.2">
<!-- giữa -->
