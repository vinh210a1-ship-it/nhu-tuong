</g>
<g style="fill:var(--hh-nuoc);fill-opacity:.45;stroke:var(--hh-nuoc-o);stroke-width:1.2">
<circle cx="26" cy="224" r="7.5"/>
<circle cx="64" cy="220" r="7.5"/>
<circle cx="84" cy="248" r="7.5"/>
<circle cx="40" cy="258" r="7.5"/>
<circle cx="70" cy="278" r="7.5"/>
<circle cx="22" cy="282" r="7.5"/>
</g>
<!-- 4: tinh thể mỡ (đoạn thẳng); hai tinh thể bắc qua cổ nối, một tinh thể của giọt riêng nhô ra ngoài -->
<g style="fill:none;stroke:var(--sl-color-white);stroke-width:1.6;stroke-linecap:round">
<line x1="218.1" y1="434.8" x2="221.9" y2="445.2"/>
<line x1="223.3" y1="452.7" x2="232.7" y2="449.3"/>
<line x1="216" y1="447.3" x2="222" y2="450.8"/>
<line x1="230.9" y1="442.2" x2="243.1" y2="437.8"/>
<line x1="244.2" y1="426.8" x2="251.8" y2="433.2"/>
<line x1="249.8" y1="443.9" x2="254.3" y2="436.1"/>
<line x1="241" y1="441.5" x2="247" y2="442.5"/>
<line x1="254.1" y1="438.3" x2="265.9" y2="443.7"/>
<line x1="270.5" y1="446.2" x2="277.5" y2="437.8"/>
<line x1="267.2" y1="450.7" x2="276.8" y2="453.3"/>
<line x1="277.4" y1="444.6" x2="278.6" y2="451.4"/>
<line x1="315.3" y1="431.2" x2="320.8" y2="440.8"/>
<line x1="321.7" y1="446.5" x2="330.3" y2="441.5"/>
<line x1="316.1" y1="447.3" x2="323.9" y2="448.7"/>
<line x1="305.6" y1="441.2" x2="316.4" y2="442.8"/>
</g>
<!-- 5: dầu khuếch tán qua nước từ giọt nhỏ sang giọt lớn -->
<g style="fill:var(--sl-color-gray-3);stroke:var(--sl-color-gray-3);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none">
<line x1="39.1" y1="415.1" x2="105.7" y2="433.7"/><polygon points="109.5,434.8 104,436.1 105.4,430.8"/>
<line x1="33.5" y1="440" x2="104.8" y2="440"/><polygon points="108.8,440 103.8,442.8 103.8,437.3"/>
<line x1="39.1" y1="464.9" x2="105.7" y2="446.3"/><polygon points="109.5,445.2 105.4,449.2 104,443.9"/>
</g>
<!-- 1: giọt nổi lên -->
<g style="fill:var(--sl-color-gray-3);stroke:var(--sl-color-gray-3);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round">
