<line x1="149.7" y1="215.8" x2="133.3" y2="185.2"/><polygon points="131,181 136.8,184.7 130.9,187.8"/><polygon points="152,220 146.2,216.3 152.1,213.2"/>
<line x1="210.3" y1="215.8" x2="226.7" y2="185.2"/><polygon points="229,181 229.1,187.8 223.2,184.7"/><polygon points="208,220 207.9,213.2 213.8,216.3"/>
<line x1="225" y1="250" x2="246.2" y2="250"/><polygon points="251,250 245,253.3 245,246.7"/>
<line x1="135" y1="250" x2="113.8" y2="250"/><polygon points="109,250 115,246.7 115,253.3"/>
<line x1="202" y1="338" x2="230.4" y2="382"/><polygon points="233,386 227,382.8 232.5,379.2"/>
<line x1="158" y1="338" x2="129.6" y2="382"/><polygon points="127,386 127.5,379.2 133,382.8"/>
</g>
<!-- nhãn: số trùng số dòng trong bảng và số mục của bài -->
<g style="fill:var(--sl-color-white);font-size:14px">
<text x="4" y="18" font-weight="700">1. Kem hóa / lắng</text>
<text x="356" y="18" text-anchor="end" font-weight="700">2. Keo tụ</text>
<text x="4" y="316" font-weight="700">6. Đảo pha</text>
<text x="356" y="316" text-anchor="end" font-weight="700">3. Hợp giọt</text>
<text x="4" y="506" font-weight="700">5. Ostwald ripening</text>
<text x="356" y="506" text-anchor="end" font-weight="700">4. Hợp giọt một phần</text>
<text x="180" y="308" text-anchor="middle" font-weight="700">Nhũ tương</text>
<text x="180" y="325" text-anchor="middle" font-weight="700">ban đầu</text>
</g>
<g style="fill:var(--sl-color-gray-2);font-size:14px">
<text x="4" y="35" font-style="italic">(creaming)</text>
<text x="4" y="52">giọt nổi hoặc chìm,</text>
<text x="4" y="69">cỡ giọt không đổi</text>
<text x="356" y="35" text-anchor="end" font-style="italic">(flocculation)</text>
<text x="356" y="52" text-anchor="end">giọt dính thành cụm,</text>
<text x="356" y="69" text-anchor="end">màng còn nguyên</text>
<text x="4" y="333" font-style="italic">(phase inversion)</text>
<text x="4" y="350">O/W thành W/O</text>
<text x="4" y="367">hoặc ngược lại</text>
<text x="356" y="333" text-anchor="end" font-style="italic">(coalescence)</text>
<text x="356" y="350" text-anchor="end">màng vỡ, hai giọt</text>
<text x="356" y="367" text-anchor="end">thành một</text>
<text x="4" y="523">giọt nhỏ tan dần, dầu đi</text>
<text x="4" y="540">qua nước sang giọt lớn</text>
<text x="356" y="523" text-anchor="end" font-style="italic">(partial coalescence)</text>
<text x="356" y="540" text-anchor="end">tinh thể mỡ đâm qua</text>
<text x="356" y="557" text-anchor="end">màng, cụm giữ hình</text>
</g>
