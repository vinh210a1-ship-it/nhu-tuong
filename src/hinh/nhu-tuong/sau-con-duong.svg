<line x1="124" y1="162" x2="124" y2="122"/><polygon points="124,118 126.8,123 121.3,123"/>
</g>
<!-- mũi tên từ nhũ tương ban đầu ra sáu ô: hai đầu = thuận nghịch (1, 2); một đầu = không thuận nghịch (3–6) -->
