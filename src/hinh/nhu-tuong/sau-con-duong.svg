<circle cx="41" cy="89" r="7.5"/>
<circle cx="65" cy="89" r="7.5"/>
<circle cx="89" cy="89" r="7.5"/>
<circle cx="113" cy="89" r="7.5"/>
<circle cx="137" cy="89" r="7.5"/>
<circle cx="160" cy="89" r="7.5"/>
<!-- 2 keo tụ -->
<circle cx="232" cy="118" r="7.5"/>
<circle cx="247.4" cy="118" r="7.5"/>
<circle cx="239.7" cy="131.3" r="7.5"/>
<circle cx="239.7" cy="104.7" r="7.5"/>
<circle cx="298" cy="128" r="7.5"/>
<circle cx="313.4" cy="128" r="7.5"/>
<circle cx="321.1" cy="141.3" r="7.5"/>
<!-- 3 hợp giọt -->
<circle cx="286" cy="235" r="11.9"/>
<circle cx="332" cy="226" r="7.5"/>
<circle cx="316" cy="270" r="9.4"/>
<!-- 5 Ostwald -->
<circle cx="28" cy="412" r="3.5"/>
<circle cx="22" cy="440" r="3.5"/>
<circle cx="28" cy="468" r="3.5"/>
<circle cx="128" cy="440" r="14.2"/>
<!-- 4 hợp giọt một phần: viền -->
<circle cx="226" cy="444" r="13"/>
<circle cx="248" cy="436" r="13"/>
<circle cx="271" cy="446" r="13"/>
<circle cx="322" cy="440" r="13"/>
</g>
<!-- 4: tô lại phần ruột để xóa viền ở chỗ hai giọt dính nhau (cổ nối) -->
<g style="fill:var(--hh-dau)">
<circle cx="226" cy="444" r="12.4"/>
<circle cx="248" cy="436" r="12.4"/>
<circle cx="271" cy="446" r="12.4"/>
</g>
<!-- 3: giọt đã hợp nằm đè lên bóng hai giọt cũ; vẽ lại bóng lên trên để vẫn thấy -->
<g style="fill:none;stroke:var(--sl-color-gray-2);stroke-width:1.2;stroke-dasharray:3 2.5">
<circle cx="308" cy="270" r="7.5"/>
<circle cx="324" cy="270" r="7.5"/>
</g>
<!-- 5: cỡ cũ của giọt lớn, vẽ trên giọt nên dùng màu chữ cho rõ -->
<g style="fill:none;stroke:var(--sl-color-white);stroke-width:1.1;stroke-dasharray:3 2.5">
<circle cx="128" cy="440" r="12"/>
</g>
<!-- 6 đảo pha: giọt nước trong dầu -->
<g style="fill:var(--hh-be-mat)">
<circle cx="26" cy="224" r="7.5"/>
<circle cx="64" cy="220" r="7.5"/>
<circle cx="84" cy="248" r="7.5"/>
<circle cx="40" cy="258" r="7.5"/>
<circle cx="70" cy="278" r="7.5"/>
